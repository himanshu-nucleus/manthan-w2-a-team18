# Backend CI: lint + format check + tests.
# This workflow lives at the repository root once the backend is merged into the
# team repo, i.e. at .github/workflows/backend-ci.yml next to the backend/ folder.
# Every step therefore runs with working-directory: backend.
#
# No postgres service container on purpose: the test harness uses in-memory
# SQLite, so the suite must pass with no database available.

name: backend-ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest -q --cov=app --cov-report=term-missing
