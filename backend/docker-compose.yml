# Backend-only compose file: FastAPI + PostgreSQL 18.
# `docker compose up` from this folder brings the API and its database up.
# NOTE: the team's final deploy/docker-compose.yml at the repo root will build on
# this and additionally run Prometheus and Grafana against the /metrics endpoint.

services:
  db:
    image: postgres:18
    container_name: manthan-db
    environment:
      POSTGRES_USER: manthan
      POSTGRES_PASSWORD: manthan
      POSTGRES_DB: manthan
    ports:
      # Host 5433 on purpose: team laptops may already run PostgreSQL on 5432.
      # Container-internal port stays 5432.
      - "5433:5432"
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # VOLUME at /var/lib/postgresql. Mounting the pre-18 /var/lib/postgresql/data
      # path looks fine but silently does not persist. Mount the parent.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manthan -d manthan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manthan-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is `db` on its internal port 5432.
      # 5433 is only the host-published port - do not use it here.
      DATABASE_URL: postgresql+psycopg://manthan:manthan@db:5432/manthan
      APP_NAME: AI Manthan Backend
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Dev convenience: source is mounted so --reload picks up edits.
      - ./app:/app/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    restart: unless-stopped

volumes:
  db_data:
