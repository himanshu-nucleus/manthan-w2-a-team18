# Serves the built single-page app and proxies the API, so the browser stays
# same-origin (http://localhost:8080 for both the app and /api).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Receipts are up to 5 MB (backend max_upload_bytes); allow a little headroom.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: any other path loads the app, which renders the route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
