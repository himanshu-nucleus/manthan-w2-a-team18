# Whole ExpenseFlow stack from a fresh clone, one command:
#
#   docker compose up --build
#
#   web         http://localhost:8080        React app; proxies /api to the api service
#   api         http://localhost:8000/docs   FastAPI (migrates + seeds itself on start)
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3000
#   postgres    localhost:5433 (host port; 5432 inside the compose network)
#
# Start order is enforced by health checks: db -> api (migrations, seed, API) -> web.
# Everything is idempotent, so restarts and `docker compose up` again are safe.
# Wipe all data (synthetic only) with `docker compose down -v`.

services:
  db:
    image: postgres:18
    container_name: manthan-db
    environment:
      POSTGRES_USER: manthan
      POSTGRES_PASSWORD: manthan
      POSTGRES_DB: manthan
    ports:
      # Host 5433 on purpose: team laptops may already run PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      # postgres:18 declares its VOLUME at /var/lib/postgresql; mount the parent,
      # not the pre-18 /var/lib/postgresql/data path, or data silently won't persist.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manthan -d manthan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    image: expenseflow-api:local
    container_name: manthan-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is `db` on its internal port 5432.
      DATABASE_URL: postgresql+psycopg://manthan:manthan@db:5432/manthan
      APP_NAME: ExpenseFlow API
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      UPLOAD_DIR: /app/uploads
      # Load backend/db/seed.sql (synthetic demo users) on every start; idempotent.
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    volumes:
      # Receipt files survive container rebuilds.
      - receipts:/app/uploads
    # The image's entrypoint runs `alembic upgrade head`, loads the seed, then uvicorn.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: expenseflow-web:local
    container_name: manthan-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: manthan-prometheus
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: manthan-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
  receipts:
