# CI: lint + format check + tests + dependency vulnerability check.
# GitHub only runs workflows from the repository-root .github/workflows/ folder.
#
# No postgres service container on purpose: the test harness uses in-memory
# SQLite, so the suite must pass with no database available.

name: ci

# Pull requests only (lead decision): plain pushes to work branches do not run CI.
on:
  pull_request:

jobs:
  api:
    name: API - lint, test, dependency check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest -q --cov=app --cov-report=term-missing

      # CI-only tool, installed here rather than added to the app lock file.
      - name: Dependency vulnerability check
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
