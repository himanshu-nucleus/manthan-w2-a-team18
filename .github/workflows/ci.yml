# CI: lint + format check + tests + dependency vulnerability check.
# GitHub only runs workflows from the repository-root .github/workflows/ folder.
#
# No postgres service container on purpose: the test harness uses in-memory
# SQLite, so the suite must pass with no database available.

name: ci

# Pull requests only (lead decision): plain pushes to work branches do not run CI.
on:
  pull_request:

jobs:
  api:
    name: API - lint, test, dependency check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest -q --cov=app --cov-report=term-missing

      # CI-only tool, installed here rather than added to the app lock file.
      - name: Dependency vulnerability check
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  web:
    name: Web - lint, format, test, build, dependency check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Version comes from the packageManager field (pnpm@11.16.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Vitest
        run: pnpm test:run

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Dependency vulnerability check
        run: pnpm audit --prod --audit-level high
